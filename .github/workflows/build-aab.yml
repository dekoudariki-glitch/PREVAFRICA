name: Build PREVAFRICA Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Configure Android SDK Path & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          mkdir -p $ANDROID_HOME/licenses
          printf "24833b298291be87002514318a362a79239eee11\n84831b9409646a918e30573bab4c9c91346d8abd\nd93811492197d10d393e8a18f02103a7638053f3\ne967250453061447d97042c06d234a6410d42126\n60100719fe09fc7d51d85521602d5161a0f8b296\n" > $ANDROID_HOME/licenses/android-sdk-license

      - name: Generate Release Keystore
        run: |
          cd android-app/app
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass prevafrica123 \
              -keypass prevafrica123 \
              -dname "CN=PREVAFRICA, OU=Dev, O=PREVAFRICA, L=Dakar, S=Dakar, C=SN"
          fi

      - name: Build Android App Bundle (.aab) with Gradle
        run: |
          cd android-app
          gradle bundleRelease --no-daemon --stacktrace

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PREVAFRICA-v28-signed
          path: android-app/app/build/outputs/bundle/release/*.aab

