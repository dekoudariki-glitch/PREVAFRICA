name: Build PREVAFRICA Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      - name: Generate Release Keystore
        run: |
          cd android-app/app
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass prevafrica123 \
              -keypass prevafrica123 \
              -dname "CN=PREVAFRICA, OU=Dev, O=PREVAFRICA, L=Dakar, S=Dakar, C=SN"
          fi

      - name: Build Android App Bundle (.aab) with Gradle
        run: |
          cd android-app
          gradle bundleRelease --no-daemon --stacktrace

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PREVAFRICA-v27-signed
          path: android-app/app/build/outputs/bundle/release/*.aab
