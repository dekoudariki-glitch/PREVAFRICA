name: Build PREVAFRICA Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Signing Keystore
        run: |
          cd android-twa
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass prevafrica123 \
              -keypass prevafrica123 \
              -dname "CN=PREVAFRICA, OU=Dev, O=PREVAFRICA, L=Dakar, S=Dakar, C=SN"
          fi

      - name: Generate Android TWA Project
        run: |
          cd android-twa
          bubblewrap update --skipExisting

      - name: Build Signed Android App Bundle (.aab)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: prevafrica123
          BUBBLEWRAP_KEY_PASSWORD: prevafrica123
        run: |
          cd android-twa
          bubblewrap build

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PREVAFRICA-v27-signed
          path: android-twa/*.aab
